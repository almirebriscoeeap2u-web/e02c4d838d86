          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target prometheus_scrape -j2
      - run:
          name: Scrape metrics endpoint
          command: LIONSS_LP=1 ./build/prometheus_scrape --config scrape.yml --target localhost
  raid-resync:
    machine:
